<!DOCTYPE html>
<html>
<head>
    <title>연결 테스트</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>브라우저 테스트</h1>
    <p>이 파일이 보인다면 브라우저는 정상입니다.</p>
    
    <h2>서버 연결 테스트</h2>
    <button onclick="testConnection()">서버 연결 테스트</button>
    <div id="result"></div>
    
    <script>
    function testConnection() {
        const result = document.getElementById('result');
        result.innerHTML = '테스트 중...';
        
        // localhost:8080 테스트
        fetch('http://localhost:8080')
            .then(response => response.text())
            .then(data => {
                result.innerHTML = '<p style="color: green;">✅ 서버 연결 성공!</p>' + data;
            })
            .catch(error => {
                result.innerHTML = '<p style="color: red;">❌ 서버 연결 실패: ' + error + '</p>';
                
                // 127.0.0.1:8080도 시도
                return fetch('http://127.0.0.1:8080');
            })
            .then(response => {
                if (response) {
                    return response.text();
                }
            })
            .then(data => {
                if (data) {
                    result.innerHTML = '<p style="color: green;">✅ 127.0.0.1:8080 연결 성공!</p>' + data;
                }
            })
            .catch(error => {
                result.innerHTML += '<br><p style="color: red;">❌ 127.0.0.1:8080도 실패: ' + error + '</p>';
            });
    }
    </script>
</body>
</html>
