# Redis Sentinel 설정 파일
# 고가용성 Redis 클러스터를 위한 Sentinel 구성

# Sentinel 포트
port 26379

# Master 모니터링 설정
# sentinel monitor <master-name> <ip> <port> <quorum>
# quorum=2: 최소 2개의 Sentinel이 Master 장애를 감지해야 Failover 시작
sentinel monitor mymaster redis-master 6379 2

# Master 비밀번호 (환경변수로 설정)
# sentinel auth-pass mymaster <password>

# Master 다운 판정 시간 (밀리초)
# 5초 동안 응답 없으면 SDOWN (Subjectively Down) 상태로 간주
sentinel down-after-milliseconds mymaster 5000

# Failover 타임아웃 (밀리초)
# Failover 시작 후 3분 이내에 완료되어야 함
sentinel failover-timeout mymaster 180000

# 동시 동기화 제한
# Failover 시 최대 1개의 Replica만 새로운 Master와 동기화
# (네트워크 부하 제한)
sentinel parallel-syncs mymaster 1

# Sentinel 작업 디렉토리
dir /data

# 로그 레벨 (debug, verbose, notice, warning)
loglevel notice

# Sentinel 설정 자동 업데이트
# Failover 발생 시 Sentinel이 이 파일을 자동으로 업데이트함
# (Master IP 변경 반영)

# 알림 스크립트 (선택)
# sentinel notification-script mymaster /path/to/notification.sh
# sentinel client-reconfig-script mymaster /path/to/reconfig.sh
