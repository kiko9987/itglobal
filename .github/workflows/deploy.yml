name: Deploy to Google Cloud Run

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: itglobal-dashboard
  REGION: asia-northeast3

jobs:
  # 코드 품질 검사
  quality-check:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black pytest pytest-cov

    - name: Code formatting check (Black)
      run: black --check --diff dashboard/

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 dashboard/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 dashboard/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Security check
      run: |
        pip install safety bandit
        safety check
        bandit -r dashboard/ -f json -o bandit-report.json || true

    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: bandit-report.json

  # 테스트 실행
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: quality-check

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Create test environment file
      run: |
        cat > dashboard/.env << EOF
        FLASK_SECRET_KEY=test-secret-key
        REDIS_HOST=localhost
        REDIS_PORT=6379
        POSTGRES_HOST=localhost
        POSTGRES_PORT=5432
        POSTGRES_DB=test_db
        POSTGRES_USER=postgres
        POSTGRES_PASSWORD=test_password
        DEBUG=true
        EOF

    - name: Run tests
      run: |
        cd dashboard
        python -m pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      with:
        file: ./dashboard/coverage.xml
        flags: unittests
        name: codecov-umbrella

  # 개발 환경 배포 (develop 브랜치)
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [quality-check, test]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Build and push Docker image
      run: |
        IMAGE_TAG="gcr.io/$PROJECT_ID/$SERVICE_NAME:dev-${{ github.sha }}"
        docker build -t $IMAGE_TAG .
        docker push $IMAGE_TAG

    - name: Deploy to Cloud Run (Development)
      run: |
        gcloud run deploy $SERVICE_NAME-dev \
          --image gcr.io/$PROJECT_ID/$SERVICE_NAME:dev-${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --memory 1Gi \
          --cpu 1 \
          --max-instances 3 \
          --set-env-vars "FLASK_ENV=development,DEBUG=true" \
          --service-account $SERVICE_NAME-sa@$PROJECT_ID.iam.gserviceaccount.com

  # 운영 환경 배포 (main 브랜치)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [quality-check, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        export_default_credentials: true

    - name: Configure Docker for GCR
      run: gcloud auth configure-docker

    - name: Build and push Docker image
      run: |
        IMAGE_TAG="gcr.io/$PROJECT_ID/$SERVICE_NAME:prod-${{ github.sha }}"
        docker build -t $IMAGE_TAG .
        docker push $IMAGE_TAG

    - name: Deploy to Cloud Run (Production)
      run: |
        gcloud run deploy $SERVICE_NAME \
          --image gcr.io/$PROJECT_ID/$SERVICE_NAME:prod-${{ github.sha }} \
          --region $REGION \
          --platform managed \
          --allow-unauthenticated \
          --memory 2Gi \
          --cpu 2 \
          --min-instances 1 \
          --max-instances 10 \
          --set-env-vars "FLASK_ENV=production,DEBUG=false" \
          --service-account $SERVICE_NAME-sa@$PROJECT_ID.iam.gserviceaccount.com

    - name: Run post-deployment tests
      run: |
        SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format="value(status.url)")

        # 헬스체크
        echo "Health check: $SERVICE_URL/health"
        curl -f "$SERVICE_URL/health" || exit 1

        # 기본 페이지 로드 테스트
        echo "Load test: $SERVICE_URL"
        curl -f "$SERVICE_URL" -o /dev/null || exit 1

    - name: Send deployment notification
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: '🚀 IT Global Dashboard가 성공적으로 배포되었습니다!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

    - name: Send failure notification
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: '❌ IT Global Dashboard 배포가 실패했습니다.'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}

  # 보안 스캔
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [quality-check]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'

    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  # 성능 테스트 (주기적)
  performance-test:
    name: Performance Test
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run load test
      run: |
        pip install locust
        cd tests/performance
        locust --headless --users 10 --spawn-rate 2 --run-time 1m --host https://$SERVICE_NAME-dev-dot-$PROJECT_ID.uc.r.appspot.com