# 전자결재 봇 슬랙 앱 manifest (2026-10-30)
# api.slack.com/apps → Create New App → From an app manifest → 워크스페이스 선택 → 아래를 붙여넣기 → Create → Install.
# 설치 후 .env 에:
#   SLACK_EAPPROVAL_BOT_TOKEN=xoxb-...        (OAuth & Permissions 의 Bot User OAuth Token)
#   SLACK_EAPPROVAL_SIGNING_SECRET=...        (Basic Information 의 Signing Secret)
#   SLACK_EAPPROVAL_CHANNEL=C0CDJUXRQGL       (#전자_결재)
# → 서버 재시작 → #전자_결재 에서 `/invite @eapproval_bot` (비공개 채널이라 초대해야 글을 올릴 수 있다).
display_information:
  name: 전자결재
  description: 자금집행 요청·승인·이체 완료를 슬랙에서 처리합니다.
  background_color: "#1f6f43"
features:
  app_home:
    home_tab_enabled: true    # 11-05 왼쪽 앱 목록 → 전자결재 → 홈 탭에 메뉴(app_home_opened 때 게시)
    messages_tab_enabled: true
    messages_tab_read_only_enabled: true
  bot_user:
    display_name: eapprovalbot   # 슬랙이 봇 표시 이름에 한글을 거부(앱 이름 name 은 한글 OK)
    always_online: true
  shortcuts:   # 11-05 입력창 [+] 「전자결재」 하나 → 메뉴 창 — callback_id 는 e_approval.SC_HUB 와 같게
    - name: 전자결재
      type: global
      callback_id: eap_sc_hub
      description: 자금집행, 비품 신청, 다른 결재 요청, 내 요청을 엽니다
  slash_commands:
    - command: /자금집행
      url: https://pm.itg-aircon.com/slack/eapproval-events
      description: 자금집행(이체) 요청 창을 엽니다
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - im:write
      - pins:read
      - pins:write
      - commands
      - files:read    # 11-05 창 「첨부 파일」에 올린 파일 받기
      - files:write   # 11-05 그 파일을 결재 카드 스레드에 올리기
functions:   # 11-05 워크플로 사용자 지정 단계 — #전자_결재 워크플로 버튼 → 메뉴 창. 키는 e_approval.FN_OPEN_MENU 와 같게
  eap_open_menu:
    title: 전자결재 열기
    description: 자금집행, 비품 신청, 다른 결재 요청, 내 요청 메뉴 창을 엽니다
    input_parameters:       # 앱 manifest 는 properties/required 로 감싸지 않는다(감싸면 저장 오류, 11-05)
      interactivity:
        type: slack#/types/interactivity
        title: 버튼 누른 사람
        is_required: true
        name: interactivity
    output_parameters: {}
settings:
  event_subscriptions:
    request_url: https://pm.itg-aircon.com/slack/eapproval-events
    bot_events:
      - app_home_opened
      - function_executed
  function_runtime: remote
  interactivity:
    is_enabled: true
    request_url: https://pm.itg-aircon.com/slack/eapproval-events
    message_menu_options_url: https://pm.itg-aircon.com/slack/eapproval-events
  org_deploy_enabled: true   # functions(워크플로 단계)에 필요 — 워크스페이스 하나라 동작 차이 없음(11-05)
  socket_mode_enabled: false
  token_rotation_enabled: false
