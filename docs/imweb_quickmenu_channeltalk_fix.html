<!--
  아임웹 '빠른 문의' 메뉴(.itg-contact-pc / .itg-contact-mobile)가 채널톡 상담창을 가리는 문제 수정 (2026-10-15)

  원인: 빠른 문의 위젯(w20260918e5baa87c03abf) CSS 가 z-index 9999, 채널톡(#ch-plugin)은 1000
        → 상담창을 열어도 빠른 문의 메뉴가 위에 겹쳐 대화 내용을 가림.
  해결: 채널톡 상담창이 열려 있는 동안만 빠른 문의 메뉴(PC 세로 메뉴·모바일 하단 바)를 숨김.
        채널톡이 상담창을 닫을 때 #ch-plugin-script 에 붙이는 'ch-messenger-hidden' 클래스를 지켜봄
        (채널톡 로딩 순서와 무관하게 동작).
  붙이는 곳: 아임웹 편집기 → '빠른 문의' HTML 위젯 코드 맨 아래 (또는 환경 설정 → 바디 코드)
  검증: 2026-10-15 실제 홈페이지(1366px)에서 닫힘=메뉴 보임 / 열림=메뉴 숨김 확인
-->
<style>
  body.itg-ch-open .itg-contact-pc,
  body.itg-ch-open .itg-contact-mobile { display: none !important; }
</style>
<script>
  (function bind(tries) {
    var box = document.getElementById('ch-plugin-script');
    if (!box) {
      if (tries < 40) setTimeout(function () { bind(tries + 1); }, 500);
      return;
    }
    var sync = function () {
      document.body.classList.toggle('itg-ch-open', !box.classList.contains('ch-messenger-hidden'));
    };
    new MutationObserver(sync).observe(box, { attributes: true, attributeFilter: ['class'] });
    sync();
  })(0);
</script>
