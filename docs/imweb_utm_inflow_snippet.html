<!--
  아임웹 바디 코드용 — 유입경로(UTM) 숨은 필드 자동 채움 (2026-10-02)
  - 폼마다 '유입경로' 라벨의 단답형 필드를 찾아 숨기고 "utm_source/utm_campaign/utm_content" 를 채움
    (예: daangn/web_install/A). 서버 파서(homepage_mail_sync.py)가 [유입:당근/web_install/A] 로 기록.
  - 필드 id 대신 라벨 텍스트로 찾으므로 설치·세척 두 폼 위젯 공통, 기존 '문의유형' 코드와 독립.
  - 첫 진입 URL 의 utm 을 sessionStorage 에 보관 → 같은 탭에서 다른 페이지로 이동 후 제출해도 유지.
  - utm 이 없으면 아무것도 채우지 않음(메일엔 라벨만 남고 파서가 빈 값 처리).
-->
<script>
(function () {
  try {
    var KEY = 'itg_inflow_v1', LABEL = '유입경로';
    var q = new URLSearchParams(location.search);
    var parts = [q.get('utm_source'), q.get('utm_campaign'), q.get('utm_content')].map(function (v) {
      return (v || '').replace(/[\/|\r\n]/g, '').trim().slice(0, 30);
    });
    var val = parts.join('/').replace(/\/+$/, '');
    if (val) { try { sessionStorage.setItem(KEY, val); } catch (e) {} }
    else { try { val = sessionStorage.getItem(KEY) || ''; } catch (e) {} }

    function apply() {
      var labels = document.querySelectorAll('.form-group > label.control-label');
      for (var i = 0; i < labels.length; i++) {
        if ((labels[i].textContent || '').trim() !== LABEL) continue;
        var group = labels[i].parentNode;
        group.style.display = 'none';
        var input = group.querySelector('input[type="text"], textarea');
        if (input && val && input.value !== val) {
          input.value = val;
          input.dispatchEvent(new Event('input', { bubbles: true }));
          input.dispatchEvent(new Event('change', { bubbles: true }));
        }
      }
    }
    apply();
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', apply);
    window.addEventListener('load', apply);
    // 제출 직전에도 한 번 더 (위젯이 늦게 그려지거나 값이 지워진 경우 대비)
    document.addEventListener('click', apply, true);
    document.addEventListener('submit', apply, true);
  } catch (e) {}
})();
</script>
