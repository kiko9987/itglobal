<style>

/* =========================================================
   1. 사이트 기본 콘텐츠 폭
   FHD/QHD 모두 1320px을 기본 기준으로 사용
========================================================= */

.body_inner,
.site_common_wrap,
.site_page_container,
.container_body{
  max-width:1320px !important;
}


/* =========================================================
   2. PC ONE-SCREEN AUTO FIT ENGINE

   적용할 코드 섹션만 아래 구조 사용:

   <section class="itg-screen">
     <div class="itg-screen-fit">
       기존 섹션
     </div>
   </section>
========================================================= */

:root{

  /* 상단 고정 메뉴 높이 */
  --itg-top:80px;

  /*
     현재 사이트 하단에 고정된 주황 CTA가 있으므로
     그 영역도 화면 높이에서 제외
  */
  --itg-bottom:0px;

  /* 위/아래 추가 안전 여백 */
  --itg-safe-gap:20px;

  /*
     너무 작게 축소되는 것 방지
     보통 FHD에서는 이 값까지 내려갈 일은 거의 없음
  */
  --itg-min-scale:.74;
}


/* PC */

@media(min-width:1051px){

  .itg-screen{
    position:relative;

    width:100%;

    /*
       실제 브라우저 화면
       - 상단 메뉴
       - 하단 고정 CTA
    */
    height:
      calc(
        100dvh
        - var(--itg-top)
        - var(--itg-bottom)
      );

    min-height:0;

    overflow:hidden;
  }


  .itg-screen-fit{
    position:absolute;

    top:50%;
    left:50%;

    width:100%;

    transform:
      translate(-50%,-50%)
      scale(var(--itg-fit-scale,1));

    transform-origin:center center;

    will-change:transform;
  }

}


/* =========================================================
   TABLET / MOBILE
   화면 한 장 강제맞춤 사용하지 않음
========================================================= */

@media(max-width:1050px){

  .itg-screen{
    position:relative;

    width:100%;

    height:auto;

    overflow:visible;
  }


  .itg-screen-fit{
    position:relative;

    top:auto;
    left:auto;

    width:100%;

    transform:none !important;
  }

}

</style>

<script>
(function(){
  try {
    var c = document.querySelector('link[rel="canonical"]');
    if (!c) return;
    var u = new URL(c.href, location.origin);
    if (/^\/index\/?$/.test(u.pathname)) u.pathname = '/';
    var p = new URLSearchParams();
    if (u.searchParams.get('bmode') === 'view' && u.searchParams.get('idx')) {
      p.set('bmode', 'view');
      p.set('idx', u.searchParams.get('idx'));
    } else if (+u.searchParams.get('page') > 1) {
      p.set('page', u.searchParams.get('page'));
    }
    var q = p.toString();
    c.href = u.origin + u.pathname + (q ? '?' + q : '');
  } catch (e) {}
})();
</script>

<!-- ================== IT GLOBAL PC SCREEN FIT ENGINE ================== -->
<script>
(function(){

  "use strict";


  function fitITGScreens(){

    var screens =
      document.querySelectorAll('.itg-screen');


    if(!screens.length){
      return;
    }


    /* =====================================================
       모바일 / 태블릿
       자동축소 기능 완전 해제
    ===================================================== */

    if(window.innerWidth <= 1050){

      screens.forEach(function(screen){

        var fit =
          screen.querySelector(
            ':scope > .itg-screen-fit'
          );


        if(!fit){
          return;
        }


        fit.style.removeProperty(
          '--itg-fit-scale'
        );

      });


      return;
    }



    /* =====================================================
       PC
    ===================================================== */

    screens.forEach(function(screen){

      var fit =
        screen.querySelector(
          ':scope > .itg-screen-fit'
        );


      if(!fit){
        return;
      }


      /*
         측정하기 전에 반드시 원본 100%로 복원
      */

      fit.style.setProperty(
        '--itg-fit-scale',
        '1'
      );



      /*
         브라우저가 레이아웃을 갱신한 뒤
         실제 크기 측정
      */

      var screenHeight =
        screen.clientHeight;


      var naturalHeight =
        fit.scrollHeight;


      if(
        !screenHeight ||
        !naturalHeight
      ){
        return;
      }



      /* CSS 공통 변수 */

      var root =
        getComputedStyle(
          document.documentElement
        );


      var safeGap =
        parseFloat(
          root.getPropertyValue(
            '--itg-safe-gap'
          )
        ) || 20;


      var minScale =
        parseFloat(
          root.getPropertyValue(
            '--itg-min-scale'
          )
        ) || .74;



      /*
         화면 안에서 실제 사용할 수 있는 높이
      */

      var availableHeight =
        Math.max(
          1,
          screenHeight - safeGap
        );



      /*
         필요한 축소율
      */

      var scale =
        availableHeight /
        naturalHeight;



      /*
         ★ 확대는 절대 하지 않음

         QHD/4K에서 공간이 남더라도
         디자인 원본 크기 100% 유지
      */

      scale =
        Math.min(
          1,
          scale
        );



      /*
         지나친 축소 방지
      */

      scale =
        Math.max(
          minScale,
          scale
        );



      fit.style.setProperty(
        '--itg-fit-scale',
        scale.toFixed(4)
      );

    });

  }



  /* =====================================================
     RESIZE
  ===================================================== */

  var resizeTimer;


  function scheduleFit(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        fitITGScreens,
        100
      );

  }



  /* =====================================================
     최초 실행
  ===================================================== */

  if(
    document.readyState ===
    'loading'
  ){

    document.addEventListener(
      'DOMContentLoaded',
      fitITGScreens
    );

  }else{

    fitITGScreens();

  }



  /* 이미지까지 전부 로딩 */

  window.addEventListener(
    'load',
    fitITGScreens
  );



  /* 화면 크기 변경 */

  window.addEventListener(
    'resize',
    scheduleFit
  );



  /* Pretendard 등 폰트 로딩 */

  if(
    document.fonts &&
    document.fonts.ready
  ){

    document.fonts.ready.then(
      fitITGScreens
    );

  }



  /*
     아임웹 렌더링 타이밍 때문에
     몇 차례 추가 측정
  */

  setTimeout(
    fitITGScreens,
    300
  );

  setTimeout(
    fitITGScreens,
    800
  );

  setTimeout(
    fitITGScreens,
    1500
  );



  /*
     나중에 콘솔이나 다른 코드에서
     수동 재계산 가능

     window.ITG_fitScreens();
  */

  window.ITG_fitScreens =
    fitITGScreens;

})();
</script>
