# 문서변환봇 슬랙 앱 manifest (2026-10-22)
# api.slack.com/apps → Create New App → From an app manifest → 워크스페이스 선택 → 아래를 붙여넣기.
# 설치 후: Bot User OAuth Token → .env SLACK_DOCVIEW_BOT_TOKEN,
#          Basic Information 의 Signing Secret → .env SLACK_DOCVIEW_SIGNING_SECRET → 서버 재시작.
# 그 뒤 HWP 자동 변환을 받을 채널(온라인 문의·방문 일정 등)에 봇을 초대한다.
display_information:
  name: 문서변환봇
  description: HWP·PDF 등 문서를 슬랙에서 읽을 수 있는 글로 바꿔 드립니다.
  background_color: "#2b5797"
features:
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: docview_bot   # 슬랙이 봇 표시 이름에 한글을 거부(앱 이름 name 은 한글 OK)
    always_online: true
oauth_config:
  scopes:
    bot:
      - channels:history
      - groups:history
      - im:history
      - files:read
      - files:write
      - chat:write
      - reactions:write
settings:
  event_subscriptions:
    request_url: https://pm.itg-aircon.com/slack/docview-events
    bot_events:
      - message.channels
      - message.groups
      - message.im
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
