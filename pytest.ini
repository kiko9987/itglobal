[pytest]
# 2026-07-24 사고 반영: tests/integration/ 는 default 실행에서 제외.
#   과거 test_redis_integration.py 가 프로덕션 Redis (localhost:6379 db=0) 를
#   flushdb 하면서 lead_card_msg, visit_auto_completed 등 운영 데이터 대량 손실.
#   fixture 는 db=15 로 격리했으나 추가 안전장치로 명시적 opt-in 필요.
#
# 통합 테스트 실행 시: pytest tests/integration/ --run-integration
#   --run-integration 은 루트 conftest.py 에서 구현(미지정 시 integration skip).
# 안전 격리: 루트 conftest.py 가 import 시점에 REDIS_DB=15·FLASK_ENV=testing 강제 +
#   RedisClient.flushdb() 가 db=0 이면 거부 → 전체 스위트(pytest) 안전 실행 가능.
testpaths = tests/unit dashboard/tests
markers =
    integration: 통합 테스트 (프로덕션 리소스 접근, --run-integration 필요)
    unit: 단위 테스트 (외부 의존 없음)
    slow: 느린 테스트
    security: 보안 테스트
