<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>캐시 모니터링 - IT Global Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        .cache-card {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            margin-bottom: 1rem;
        }
        .cache-card-header {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            border-bottom: 1px solid #dee2e6;
            padding: 1rem;
            font-weight: 600;
        }
        .cache-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f1f3f4;
        }
        .cache-stat:last-child {
            border-bottom: none;
        }
        .stat-value {
            font-weight: 600;
            color: #0d6efd;
        }
        .hit-rate {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .hit-rate.good { color: #198754; }
        .hit-rate.medium { color: #fd7e14; }
        .hit-rate.poor { color: #dc3545; }
        .refresh-btn {
            background: linear-gradient(135deg, #0d6efd 0%, #0b5ed7 100%);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(13, 110, 253, 0.3);
        }
        .clear-cache-btn {
            background: linear-gradient(135deg, #dc3545 0%, #bb2d3b 100%);
            border: none;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            transition: all 0.3s ease;
        }
        .clear-cache-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 8px rgba(220, 53, 69, 0.3);
        }
        .auto-refresh {
            background: linear-gradient(135deg, #198754 0%, #157347 100%);
            border: none;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 0.25rem;
            font-size: 0.875rem;
        }
        .loading-spinner {
            display: none;
        }
        .strategy-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            margin-left: 0.5rem;
        }
        .strategy-critical { background-color: #dc3545; color: white; }
        .strategy-static { background-color: #6c757d; color: white; }
        .strategy-folder { background-color: #0dcaf0; color: black; }
        .strategy-ui { background-color: #ffc107; color: black; }
        .strategy-temp { background-color: #6f42c1; color: white; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/projects">
                <i class="fas fa-chart-line me-2"></i>IT Global Dashboard
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/projects">
                    <i class="fas fa-arrow-left me-1"></i>프로젝트 관리로 돌아가기
                </a>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2><i class="fas fa-tachometer-alt me-2"></i>캐시 모니터링</h2>
                    <div>
                        <button class="btn auto-refresh" id="autoRefreshBtn" onclick="toggleAutoRefresh()">
                            <i class="fas fa-sync-alt me-1"></i>자동 새로고침 OFF
                        </button>
                        <button class="btn refresh-btn" onclick="loadCacheStats()">
                            <i class="fas fa-sync-alt me-1"></i>새로고침
                        </button>
                        <button class="btn clear-cache-btn" onclick="clearAllCache()">
                            <i class="fas fa-trash me-1"></i>전체 캐시 삭제
                        </button>
                    </div>
                </div>

                <div class="row">
                    <!-- 기본 캐시 통계 -->
                    <div class="col-md-6">
                        <div class="cache-card">
                            <div class="cache-card-header">
                                <i class="fas fa-database me-2"></i>기본 캐시 (MemoryCache)
                            </div>
                            <div class="card-body">
                                <div id="basicCacheStats">
                                    <div class="loading-spinner text-center py-3">
                                        <i class="fas fa-spinner fa-spin"></i> 로딩 중...
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 스마트 캐시 통계 -->
                    <div class="col-md-6">
                        <div class="cache-card">
                            <div class="cache-card-header">
                                <i class="fas fa-brain me-2"></i>스마트 캐시 (SmartCacheManager)
                            </div>
                            <div class="card-body">
                                <div id="smartCacheStats">
                                    <div class="loading-spinner text-center py-3">
                                        <i class="fas fa-spinner fa-spin"></i> 로딩 중...
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 캐시 히트율 요약 -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="cache-card">
                            <div class="cache-card-header">
                                <i class="fas fa-chart-bar me-2"></i>성능 요약
                            </div>
                            <div class="card-body">
                                <div class="row text-center">
                                    <div class="col-md-3">
                                        <h5>전체 히트율</h5>
                                        <div class="hit-rate" id="overallHitRate">--%</div>
                                    </div>
                                    <div class="col-md-3">
                                        <h5>총 캐시 항목</h5>
                                        <div class="hit-rate" id="totalItems">--</div>
                                    </div>
                                    <div class="col-md-3">
                                        <h5>메모리 사용량</h5>
                                        <div class="hit-rate" id="memoryUsage">-- MB</div>
                                    </div>
                                    <div class="col-md-3">
                                        <h5>마지막 업데이트</h5>
                                        <div class="hit-rate" id="lastUpdate">--</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 캐시 전략별 분포 -->
                <div class="row mt-4">
                    <div class="col-12">
                        <div class="cache-card">
                            <div class="cache-card-header">
                                <i class="fas fa-pie-chart me-2"></i>캐시 전략별 분포
                            </div>
                            <div class="card-body">
                                <div id="strategyDistribution">
                                    <div class="loading-spinner text-center py-3">
                                        <i class="fas fa-spinner fa-spin"></i> 로딩 중...
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let autoRefreshInterval = null;
        let isAutoRefresh = false;

        // 페이지 로드 시 초기 데이터 로드
        document.addEventListener('DOMContentLoaded', function() {
            loadCacheStats();
        });

        // 캐시 통계 로드
        async function loadCacheStats() {
            try {
                showLoading(true);

                const response = await fetch('/api/cache-stats');
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                updateBasicCacheStats(data.basic_cache || {});
                updateSmartCacheStats(data.smart_cache || {});
                updateSummary(data);

            } catch (error) {
                console.error('캐시 통계 로드 실패:', error);
                showError('캐시 통계를 불러오는데 실패했습니다: ' + error.message);
            } finally {
                showLoading(false);
            }
        }

        // 기본 캐시 통계 업데이트
        function updateBasicCacheStats(stats) {
            const container = document.getElementById('basicCacheStats');
            const total = stats.total_items || 0;
            const active = stats.active_items || 0;
            const expired = stats.expired_items || 0;
            const memory = (stats.memory_usage_estimate || 0) / (1024 * 1024);

            container.innerHTML = `
                <div class="cache-stat">
                    <span>총 항목 수</span>
                    <span class="stat-value">${total.toLocaleString()}</span>
                </div>
                <div class="cache-stat">
                    <span>활성 항목</span>
                    <span class="stat-value text-success">${active.toLocaleString()}</span>
                </div>
                <div class="cache-stat">
                    <span>만료된 항목</span>
                    <span class="stat-value text-warning">${expired.toLocaleString()}</span>
                </div>
                <div class="cache-stat">
                    <span>메모리 사용량 (추정)</span>
                    <span class="stat-value">${memory.toFixed(2)} MB</span>
                </div>
            `;
        }

        // 스마트 캐시 통계 업데이트
        function updateSmartCacheStats(stats) {
            const container = document.getElementById('smartCacheStats');
            const total = stats.total_items || 0;
            const active = stats.active_items || 0;
            const expired = stats.expired_items || 0;
            const memory = stats.memory_usage_mb || 0;
            const hitRate = stats.hit_rate || 0;

            container.innerHTML = `
                <div class="cache-stat">
                    <span>총 항목 수</span>
                    <span class="stat-value">${total.toLocaleString()}</span>
                </div>
                <div class="cache-stat">
                    <span>활성 항목</span>
                    <span class="stat-value text-success">${active.toLocaleString()}</span>
                </div>
                <div class="cache-stat">
                    <span>만료된 항목</span>
                    <span class="stat-value text-warning">${expired.toLocaleString()}</span>
                </div>
                <div class="cache-stat">
                    <span>메모리 사용량</span>
                    <span class="stat-value">${memory.toFixed(2)} MB</span>
                </div>
                <div class="cache-stat">
                    <span>히트율</span>
                    <span class="stat-value">${hitRate.toFixed(1)}%</span>
                </div>
            `;

            // 전략별 분포 업데이트
            updateStrategyDistribution(stats.strategy_distribution || {});
        }

        // 성능 요약 업데이트
        function updateSummary(data) {
            const basicStats = data.basic_cache || {};
            const smartStats = data.smart_cache || {};

            // 전체 히트율 계산 (스마트 캐시 기준)
            const hitRate = smartStats.hit_rate || 0;
            const hitRateClass = hitRate >= 80 ? 'good' : hitRate >= 50 ? 'medium' : 'poor';

            // 총 항목 수
            const totalItems = (basicStats.total_items || 0) + (smartStats.total_items || 0);

            // 총 메모리 사용량
            const basicMemory = (basicStats.memory_usage_estimate || 0) / (1024 * 1024);
            const smartMemory = smartStats.memory_usage_mb || 0;
            const totalMemory = basicMemory + smartMemory;

            // 마지막 업데이트 시간
            const lastUpdate = new Date(data.timestamp || Date.now()).toLocaleTimeString();

            document.getElementById('overallHitRate').className = `hit-rate ${hitRateClass}`;
            document.getElementById('overallHitRate').textContent = `${hitRate.toFixed(1)}%`;
            document.getElementById('totalItems').textContent = totalItems.toLocaleString();
            document.getElementById('memoryUsage').textContent = `${totalMemory.toFixed(2)} MB`;
            document.getElementById('lastUpdate').textContent = lastUpdate;
        }

        // 전략별 분포 업데이트
        function updateStrategyDistribution(distribution) {
            const container = document.getElementById('strategyDistribution');

            if (Object.keys(distribution).length === 0) {
                container.innerHTML = '<p class="text-muted text-center">전략별 데이터가 없습니다.</p>';
                return;
            }

            const strategyNames = {
                'critical_data': '중요 데이터',
                'static_config': '정적 설정',
                'folder_mapping': '폴더 매핑',
                'ui_state': 'UI 상태',
                'temporary': '임시 데이터'
            };

            const strategyClasses = {
                'critical_data': 'strategy-critical',
                'static_config': 'strategy-static',
                'folder_mapping': 'strategy-folder',
                'ui_state': 'strategy-ui',
                'temporary': 'strategy-temp'
            };

            let html = '<div class="row">';
            for (const [strategy, count] of Object.entries(distribution)) {
                const displayName = strategyNames[strategy] || strategy;
                const badgeClass = strategyClasses[strategy] || 'bg-secondary';

                html += `
                    <div class="col-md-6 mb-2">
                        <div class="d-flex justify-content-between align-items-center">
                            <span>${displayName}</span>
                            <span class="strategy-badge ${badgeClass}">${count}</span>
                        </div>
                    </div>
                `;
            }
            html += '</div>';

            container.innerHTML = html;
        }

        // 자동 새로고침 토글
        function toggleAutoRefresh() {
            const btn = document.getElementById('autoRefreshBtn');

            if (isAutoRefresh) {
                // 자동 새로고침 중지
                clearInterval(autoRefreshInterval);
                isAutoRefresh = false;
                btn.innerHTML = '<i class="fas fa-sync-alt me-1"></i>자동 새로고침 OFF';
                btn.classList.remove('btn-danger');
                btn.classList.add('auto-refresh');
            } else {
                // 자동 새로고침 시작 (5초마다)
                autoRefreshInterval = setInterval(loadCacheStats, 5000);
                isAutoRefresh = true;
                btn.innerHTML = '<i class="fas fa-sync-alt me-1 fa-spin"></i>자동 새로고침 ON';
                btn.classList.remove('auto-refresh');
                btn.classList.add('btn-danger');
            }
        }

        // 전체 캐시 삭제
        async function clearAllCache() {
            if (!confirm('정말로 전체 캐시를 삭제하시겠습니까?\n이 작업은 되돌릴 수 없습니다.')) {
                return;
            }

            try {
                const response = await fetch('/api/cache-clear', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                if (result.success) {
                    alert('전체 캐시가 성공적으로 삭제되었습니다.');
                    // 즉시 새로운 통계 로드
                    setTimeout(loadCacheStats, 500);
                } else {
                    throw new Error(result.error || '캐시 삭제에 실패했습니다.');
                }

            } catch (error) {
                console.error('캐시 삭제 실패:', error);
                alert('캐시 삭제에 실패했습니다: ' + error.message);
            }
        }

        // 로딩 상태 표시
        function showLoading(show) {
            const spinners = document.querySelectorAll('.loading-spinner');
            spinners.forEach(spinner => {
                spinner.style.display = show ? 'block' : 'none';
            });
        }

        // 에러 메시지 표시
        function showError(message) {
            const containers = ['basicCacheStats', 'smartCacheStats'];
            containers.forEach(id => {
                const container = document.getElementById(id);
                container.innerHTML = `
                    <div class="alert alert-danger text-center">
                        <i class="fas fa-exclamation-triangle me-2"></i>
                        ${message}
                    </div>
                `;
            });
        }

        // 페이지 언로드 시 자동 새로고침 정리
        window.addEventListener('beforeunload', function() {
            if (autoRefreshInterval) {
                clearInterval(autoRefreshInterval);
            }
        });
    </script>
</body>
</html>
