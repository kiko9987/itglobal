<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - IT Global 프로젝트 관리</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-color: #FF6B35;
            --primary-dark: #E55A2B;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
            --gray-800: #1e293b;
            --gray-900: #0f172a;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
            overflow: hidden;
            max-width: 400px;
            width: 100%;
        }

        .login-header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            padding: 2rem;
            text-align: center;
            color: white;
        }

        .login-header .logo {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-header .subtitle {
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .login-form {
            padding: 2rem;
        }


        .alert {
            border-radius: 12px;
            border: none;
            font-size: 0.9rem;
        }


        .btn-google {
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: #374151;
            text-decoration: none;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-google:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            text-decoration: none;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="login-container">
                    <div class="login-header">
                        <div class="logo">
                            <i class="fas fa-building me-2"></i>
                            IT GLOBAL
                        </div>
                        <div class="subtitle">프로젝트 관리 시스템</div>
                    </div>
                    
                    <div class="login-form">
                        <div id="alert-container"></div>
                        
                        {% if oauth_enabled %}
                        <!-- Google OAuth 로그인 (유일한 로그인 방법) -->
                        <div class="mb-4">
                            <a href="/auth/google" class="btn btn-google w-100">
                                <svg class="me-2" width="18" height="18" viewBox="0 0 24 24">
                                    <path fill="#4285f4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                    <path fill="#34a853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                    <path fill="#fbbc05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                    <path fill="#ea4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                                </svg>
                                회사 구글 계정으로 로그인
                            </a>
                            <div class="text-center mt-3">
                                <small class="text-muted">@itg-aircon.com 도메인 계정만 접속 가능합니다</small>
                            </div>
                            <div class="text-center mt-2">
                                <small class="text-muted">신규 사용자는 자동으로 등록되며, 관리자 승인 후 권한이 부여됩니다</small>
                            </div>
                        </div>
                        {% else %}
                        <!-- OAuth가 설정되지 않은 경우 -->
                        <div class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle me-2"></i>
                            Google OAuth가 설정되지 않았습니다. 관리자에게 문의하세요.
                        </div>
                        {% endif %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        function showAlert(message, type = 'danger') {
            const alertContainer = document.getElementById('alert-container');
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            alertContainer.innerHTML = alertHtml;
        }

        // Google OAuth 전용 로그인 페이지

        // URL 파라미터에서 메시지 확인
        const urlParams = new URLSearchParams(window.location.search);
        const message = urlParams.get('message');
        if (message) {
            if (message === 'logout_success') {
                showAlert('성공적으로 로그아웃되었습니다.', 'success');
            } else if (message === 'session_expired') {
                showAlert('세션이 만료되었습니다. 다시 로그인해주세요.', 'warning');
            } else if (message === 'access_denied') {
                showAlert('로그인이 필요합니다.', 'warning');
            } else if (message === 'domain_not_allowed') {
                showAlert('@itg-aircon.com 도메인 계정만 접속 가능합니다.', 'danger');
            } else if (message === 'oauth_error') {
                showAlert('구글 로그인 중 오류가 발생했습니다. 다시 시도해주세요.', 'danger');
            } else if (message === 'oauth_cancelled') {
                showAlert('구글 로그인이 취소되었습니다.', 'info');
            } else if (message === 'oauth_not_configured') {
                showAlert('구글 로그인이 설정되지 않았습니다. 관리자에게 문의하세요.', 'warning');
            } else if (message === 'login_failed') {
                showAlert('로그인에 실패했습니다. 다시 시도해주세요.', 'danger');
            }
        }
    </script>
</body>
</html>
