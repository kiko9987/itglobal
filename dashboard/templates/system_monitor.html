<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 모니터링 - IT Global Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .metric-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .metric-card.warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        .metric-card.danger {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
        }
        .metric-value {
            font-size: 2.5rem;
            font-weight: bold;
        }
        .metric-label {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        .chart-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            padding: 20px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-online { background-color: #28a745; }
        .status-offline { background-color: #dc3545; }
        .status-warning { background-color: #ffc107; }
        .log-container {
            background: #f8f9fa;
            border-radius: 10px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="/"><i class="fas fa-chart-line me-2"></i>IT Global Dashboard</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="/admin/cache-monitor"><i class="fas fa-memory me-1"></i>캐시 모니터</a>
                <a class="nav-link" href="/dashboard"><i class="fas fa-home me-1"></i>대시보드</a>
                <a class="nav-link" href="/logout"><i class="fas fa-sign-out-alt me-1"></i>로그아웃</a>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <div class="row">
            <div class="col-12">
                <h2><i class="fas fa-desktop me-2"></i>시스템 모니터링</h2>
                <p class="text-muted">실시간 시스템 상태 및 성능 지표</p>
            </div>
        </div>

        <!-- 시스템 지표 카드 -->
        <div class="row mb-4">
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-microchip fa-2x mb-2"></i>
                        <div class="metric-value" id="cpu-usage">--%</div>
                        <div class="metric-label">CPU 사용률</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-memory fa-2x mb-2"></i>
                        <div class="metric-value" id="memory-usage">--%</div>
                        <div class="metric-label">메모리 사용률</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-hdd fa-2x mb-2"></i>
                        <div class="metric-value" id="disk-usage">--%</div>
                        <div class="metric-label">디스크 사용률</div>
                    </div>
                </div>
            </div>
            <div class="col-md-3 mb-3">
                <div class="card metric-card h-100">
                    <div class="card-body text-center">
                        <i class="fas fa-users fa-2x mb-2"></i>
                        <div class="metric-value" id="active-sessions">--</div>
                        <div class="metric-label">활성 세션</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 시스템 상태 -->
            <div class="col-md-6 mb-4">
                <div class="chart-container">
                    <h5><i class="fas fa-heartbeat me-2"></i>시스템 상태</h5>
                    <div class="table-responsive">
                        <table class="table table-sm">
                            <tbody id="system-status">
                                <tr>
                                    <td><span class="status-indicator status-online"></span>클라우드 모니터링</td>
                                    <td><span class="badge bg-success">정상</span></td>
                                </tr>
                                <tr>
                                    <td><span class="status-indicator status-online"></span>데이터베이스</td>
                                    <td><span class="badge bg-success">정상</span></td>
                                </tr>
                                <tr>
                                    <td><span class="status-indicator status-online"></span>Redis 캐시</td>
                                    <td><span class="badge bg-success">정상</span></td>
                                </tr>
                                <tr>
                                    <td><span class="status-indicator status-online"></span>Google Sheets API</td>
                                    <td><span class="badge bg-success">정상</span></td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- 성능 차트 -->
            <div class="col-md-6 mb-4">
                <div class="chart-container">
                    <h5><i class="fas fa-chart-area me-2"></i>성능 추이</h5>
                    <canvas id="performance-chart" height="200"></canvas>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- 최근 알림 -->
            <div class="col-md-6 mb-4">
                <div class="chart-container">
                    <h5><i class="fas fa-bell me-2"></i>최근 알림</h5>
                    <div id="recent-alerts">
                        <div class="alert alert-info alert-sm">
                            <i class="fas fa-info-circle me-2"></i>
                            <small>시스템 모니터링이 정상적으로 작동 중입니다.</small>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 시스템 로그 -->
            <div class="col-md-6 mb-4">
                <div class="chart-container">
                    <h5><i class="fas fa-file-alt me-2"></i>시스템 로그</h5>
                    <div class="log-container p-3" id="system-logs">
                        <div class="text-muted">로그를 불러오는 중...</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 상세 메트릭 -->
        <div class="row">
            <div class="col-12">
                <div class="chart-container">
                    <h5><i class="fas fa-tachometer-alt me-2"></i>상세 메트릭</h5>
                    <div class="row">
                        <div class="col-md-4">
                            <canvas id="cpu-chart" height="150"></canvas>
                        </div>
                        <div class="col-md-4">
                            <canvas id="memory-chart" height="150"></canvas>
                        </div>
                        <div class="col-md-4">
                            <canvas id="network-chart" height="150"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let performanceChart, cpuChart, memoryChart, networkChart;
        let metricsData = {
            cpu: [],
            memory: [],
            network: [],
            timestamps: []
        };

        // 차트 초기화
        function initCharts() {
            // 성능 추이 차트
            const performanceCtx = document.getElementById('performance-chart').getContext('2d');
            performanceChart = new Chart(performanceCtx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'CPU',
                        data: [],
                        borderColor: 'rgb(75, 192, 192)',
                        tension: 0.1
                    }, {
                        label: '메모리',
                        data: [],
                        borderColor: 'rgb(255, 99, 132)',
                        tension: 0.1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });

            // CPU 차트
            const cpuCtx = document.getElementById('cpu-chart').getContext('2d');
            cpuChart = new Chart(cpuCtx, {
                type: 'doughnut',
                data: {
                    labels: ['사용됨', '사용 가능'],
                    datasets: [{
                        data: [0, 100],
                        backgroundColor: ['#ff6384', '#e0e0e0']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 메모리 차트
            const memoryCtx = document.getElementById('memory-chart').getContext('2d');
            memoryChart = new Chart(memoryCtx, {
                type: 'doughnut',
                data: {
                    labels: ['사용됨', '사용 가능'],
                    datasets: [{
                        data: [0, 100],
                        backgroundColor: ['#36a2eb', '#e0e0e0']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            // 네트워크 차트
            const networkCtx = document.getElementById('network-chart').getContext('2d');
            networkChart = new Chart(networkCtx, {
                type: 'bar',
                data: {
                    labels: ['송신', '수신'],
                    datasets: [{
                        data: [0, 0],
                        backgroundColor: ['#4bc0c0', '#9966ff']
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        // 모니터링 데이터 가져오기
        function fetchMonitoringData() {
            fetch('/api/admin/monitoring-status')
                .then(response => response.json())
                .then(data => {
                    updateMetrics(data);
                })
                .catch(error => {
                    console.error('모니터링 데이터 가져오기 실패:', error);
                });
        }

        // 메트릭 업데이트
        function updateMetrics(data) {
            // CPU 사용률 업데이트
            const cpuUsage = Math.round(Math.random() * 100); // 임시 데이터
            document.getElementById('cpu-usage').textContent = cpuUsage + '%';
            updateCard('cpu-usage', cpuUsage);

            // 메모리 사용률 업데이트
            const memoryUsage = Math.round(Math.random() * 100);
            document.getElementById('memory-usage').textContent = memoryUsage + '%';
            updateCard('memory-usage', memoryUsage);

            // 디스크 사용률 업데이트
            const diskUsage = Math.round(Math.random() * 100);
            document.getElementById('disk-usage').textContent = diskUsage + '%';
            updateCard('disk-usage', diskUsage);

            // 활성 세션 수
            const activeSessions = Math.round(Math.random() * 50);
            document.getElementById('active-sessions').textContent = activeSessions;

            // 차트 업데이트
            updateCharts(cpuUsage, memoryUsage, diskUsage);
        }

        // 카드 색상 업데이트
        function updateCard(elementId, value) {
            const card = document.getElementById(elementId).closest('.metric-card');
            card.className = 'card metric-card h-100';
            if (value > 80) {
                card.classList.add('danger');
            } else if (value > 60) {
                card.classList.add('warning');
            }
        }

        // 차트 업데이트
        function updateCharts(cpu, memory, disk) {
            const now = new Date().toLocaleTimeString();

            // 성능 추이 차트
            if (performanceChart.data.labels.length > 20) {
                performanceChart.data.labels.shift();
                performanceChart.data.datasets[0].data.shift();
                performanceChart.data.datasets[1].data.shift();
            }
            performanceChart.data.labels.push(now);
            performanceChart.data.datasets[0].data.push(cpu);
            performanceChart.data.datasets[1].data.push(memory);
            performanceChart.update();

            // 도넛 차트 업데이트
            cpuChart.data.datasets[0].data = [cpu, 100 - cpu];
            cpuChart.update();

            memoryChart.data.datasets[0].data = [memory, 100 - memory];
            memoryChart.update();

            // 네트워크 차트 (임시 데이터)
            const networkIn = Math.round(Math.random() * 1000);
            const networkOut = Math.round(Math.random() * 1000);
            networkChart.data.datasets[0].data = [networkOut, networkIn];
            networkChart.update();
        }

        // 시스템 로그 업데이트
        function updateSystemLogs() {
            const logs = [
                `[${new Date().toLocaleString()}] INFO: 시스템 정상 작동 중`,
                `[${new Date().toLocaleString()}] DEBUG: 메모리 사용량 체크 완료`,
                `[${new Date().toLocaleString()}] INFO: 데이터베이스 연결 확인됨`
            ];

            const logContainer = document.getElementById('system-logs');
            logContainer.innerHTML = logs.map(log => `<div>${log}</div>`).join('');
        }

        // 초기화 및 주기적 업데이트
        document.addEventListener('DOMContentLoaded', function() {
            initCharts();
            fetchMonitoringData();
            updateSystemLogs();

            // 5초마다 데이터 업데이트
            setInterval(fetchMonitoringData, 5000);
            setInterval(updateSystemLogs, 10000);
        });
    </script>
</body>
</html>
