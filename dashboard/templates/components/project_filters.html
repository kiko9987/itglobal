<!-- 현대화된 필터 섹션 (고정) -->
<div class="filter-section-sticky">
    <div class="filter-section">
        <div class="row">
            <div class="col-md-1">
                <label for="companyFilter" class="form-label">사업자</label>
                <select class="form-select" id="companyFilter">
                    <option value="">전체</option>
                    <!-- 동적으로 사업자 목록이 로드됩니다 -->
                </select>
            </div>

            <div class="col-md-1">
                <label for="managerFilter" class="form-label">담당자</label>
                <select class="form-select" id="managerFilter">
                    <option value="">전체</option>
                    <!-- 동적으로 담당자 목록이 로드됩니다 -->
                </select>
            </div>

            <div class="col-md-1">
                <label for="clientFilter" class="form-label">유입 구분</label>
                <select class="form-select" id="clientFilter">
                    <option value="">전체</option>
                    <!-- 동적으로 거래처(유입채널) 목록이 로드됩니다 -->
                </select>
            </div>

            <div class="col-md-1">
                <label for="businessNameFilter" class="form-label">사업자명</label>
                <select class="form-select" id="businessNameFilter">
                    <option value="">전체</option>
                    <!-- 동적으로 사업자명 목록이 로드됩니다 -->
                </select>
            </div>

            <div class="col-md-1">
                <label for="statusFilter" class="form-label">상태</label>
                <select class="form-select" id="statusFilter">
                    <option value="">전체</option>
                    <!-- 동적으로 상태 목록이 로드됩니다 -->
                </select>
            </div>

            <div class="col-md-1">
                <label for="invoiceFilter" class="form-label">세금계산서</label>
                <select class="form-select" id="invoiceFilter">
                    <option value="">전체</option>
                    <!-- 동적으로 시트 Y열 값 unique 로드 -->
                </select>
            </div>

            <div class="col-md-1" id="outstandingFilterCol">
                <label for="outstandingFilter" class="form-label">미수금</label>
                <select class="form-select" id="outstandingFilter">
                    <option value="">전체</option>
                    <option value="collected">수금 완료</option>
                    <option value="outstanding">미수금 있음</option>
                </select>
            </div>

            <!-- A/S 관리 모드 전용 — 미수금 필터 자리에 교체 표시 (일반 모드에선 숨김) -->
            <div class="col-md-1" id="asStatusFilterCol" style="display:none;">
                <label for="asStatusFilter" class="form-label">A/S 상태</label>
                <select class="form-select" id="asStatusFilter">
                    <option value="active" selected>진행 중</option>
                    <option value="completed">완료</option>
                    <option value="all">전체</option>
                </select>
            </div>

            <div class="col-md-1">
                <label for="dataFilter" class="form-label">데이터</label>
                <select class="form-select" id="dataFilter">
                    <option value="">전체</option>
                    <option value="complete">완료</option>
                    <option value="incomplete">미완료</option>
                </select>
            </div>

            <div class="col-md-1">
                <label for="searchInput" class="form-label">키워드 검색</label>
                <input type="text" class="form-control" id="searchInput"
                       placeholder="검색...">
            </div>

            <div class="col-md-3">
                <label class="form-label" style="margin-bottom: 0; visibility: hidden;">&nbsp;</label>
                <div class="d-flex gap-2 filter-actions-row" style="margin-top: 0.25rem; flex-wrap: wrap; align-items: center;">
                    <button class="btn btn-outline-secondary btn-sm" onclick="modernFilters.resetFilters()" title="필터 전체 초기화">
                        <i class="fas fa-times me-1"></i>초기화
                    </button>
                    <button class="btn btn-outline-primary btn-sm" onclick="modernFilters.savePresetPrompt()" title="현재 필터 조합을 프리셋으로 저장">
                        <i class="fas fa-bookmark me-1"></i>프리셋 저장
                    </button>
                    <div class="filter-result-display">
                        <span class="filter-result-count" id="filterResultCount">로딩 중...</span>
                    </div>
                </div>
                <div id="filterPresetsContainer" class="d-flex gap-1 mt-2 flex-wrap" style="min-height: 1.5rem;"></div>
            </div>
        </div>
    </div>
</div>
