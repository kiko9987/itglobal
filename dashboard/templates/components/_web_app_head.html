{# 홈 화면 앱(웹 앱 설치, 2026-11-15) — 휴대폰 '홈 화면에 추가' 뒤 주소창 없이 열리게.
   설치 정보는 /manifest.webmanifest(로그인 없이 읽힘). 서비스 워커는 쓰지 않는다(sw.js 머리말 — 2026-07-08 끈 이유). #}
<link rel="manifest" href="/manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="아이티글로벌">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="아이티글로벌">
<script>
  /* 크롬·엣지가 '설치할 수 있음'을 알려 주면 잡아 둔다 — 사용자 메뉴 [앱으로 설치]가 이걸로 설치 창을 띄움(gw-install.js).
     화면 스크립트보다 먼저 올 수 있어 머리에서 받는다. */
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__gwInstallEvt = e; });
</script>
