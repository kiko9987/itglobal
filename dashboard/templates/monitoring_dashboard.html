<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성능 모니터링 대시보드</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Socket.IO for real-time updates -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <!-- Custom Dashboard CSS -->
    <link href="{{ url_for('static', filename='css/monitoring-dashboard.css') }}" rel="stylesheet">

</head>
<body>
    <div class="dashboard-header">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <h1><i class="fas fa-chart-line me-3"></i>성능 모니터링 대시보드</h1>
                    <p class="mb-0">실시간 시스템 성능 및 애플리케이션 메트릭 모니터링</p>
                </div>
                <div class="col-md-4 text-end">
                    <button class="btn refresh-btn" onclick="refreshAllData()">
                        <i class="fas fa-sync-alt me-2"></i>새로고침
                    </button>
                    <div class="last-updated mt-2" id="lastUpdated">
                        마지막 업데이트: 로딩 중...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <!-- 시스템 상태 개요 -->
        <div class="row mb-4">
            <div class="col-12">
                <h3><i class="fas fa-tachometer-alt me-2"></i>시스템 상태 개요</h3>
            </div>
        </div>

        <div class="row mb-4">
            <div class="col-lg-3 col-md-6">
                <div class="metric-card text-center">
                    <div class="metric-value status-healthy" id="cpuUsage">--</div>
                    <div class="metric-label">CPU 사용률</div>
                    <div class="metric-trend" id="cpuTrend">
                        <i class="fas fa-chart-line me-1"></i>추이 분석 중...
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="metric-card text-center">
                    <div class="metric-value status-healthy" id="memoryUsage">--</div>
                    <div class="metric-label">메모리 사용률</div>
                    <div class="metric-trend" id="memoryTrend">
                        <i class="fas fa-chart-line me-1"></i>추이 분석 중...
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="metric-card text-center">
                    <div class="metric-value status-healthy" id="diskUsage">--</div>
                    <div class="metric-label">디스크 사용률</div>
                    <div class="metric-trend" id="diskTrend">
                        <i class="fas fa-chart-line me-1"></i>추이 분석 중...
                    </div>
                </div>
            </div>

            <div class="col-lg-3 col-md-6">
                <div class="metric-card text-center">
                    <div class="metric-value status-healthy" id="responseTime">--</div>
                    <div class="metric-label">평균 응답시간</div>
                    <div class="metric-trend" id="responseTrend">
                        <i class="fas fa-chart-line me-1"></i>추이 분석 중...
                    </div>
                </div>
            </div>
        </div>

        <!-- HTTP 성능 메트릭 -->
        <div class="row mb-4">
            <div class="col-lg-8">
                <div class="metric-card">
                    <h5><i class="fas fa-globe me-2"></i>HTTP 성능 트렌드</h5>
                    <div class="chart-container">
                        <canvas id="httpPerformanceChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="metric-card">
                    <h5><i class="fas fa-server me-2"></i>시스템 리소스</h5>
                    <div class="chart-container">
                        <canvas id="systemResourceChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- 에러 및 알림 현황 -->
        <div class="row mb-4">
            <div class="col-lg-6">
                <div class="metric-card">
                    <h5><i class="fas fa-exclamation-triangle me-2"></i>에러 현황</h5>
                    <div id="errorStatus">
                        <div class="loading-spinner">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">로딩 중...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-6">
                <div class="metric-card">
                    <h5><i class="fas fa-bell me-2"></i>최근 알림</h5>
                    <div id="recentAlerts">
                        <div class="loading-spinner">
                            <div class="spinner-border text-primary" role="status">
                                <span class="visually-hidden">로딩 중...</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 상세 메트릭 정보 -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="metric-card">
                    <h5><i class="fas fa-list me-2"></i>상세 메트릭 현황</h5>
                    <div class="table-responsive">
                        <table class="table table-hover" id="metricsTable">
                            <thead>
                                <tr>
                                    <th>메트릭명</th>
                                    <th>현재값</th>
                                    <th>타입</th>
                                    <th>단위</th>
                                    <th>마지막 업데이트</th>
                                    <th>상태</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td colspan="6" class="text-center">
                                        <div class="spinner-border text-primary me-2" role="status"></div>
                                        메트릭 데이터 로딩 중...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom Dashboard JavaScript -->
    <script src="{{ url_for('static', filename='js/monitoring-dashboard.js') }}"></script>
</body>
</html>
