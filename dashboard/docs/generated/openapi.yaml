components:
  parameters:
    LimitParam:
      description: 페이지당 항목 수
      in: query
      name: limit
      schema:
        default: 20
        maximum: 100
        minimum: 1
        type: integer
    PageParam:
      description: 페이지 번호
      in: query
      name: page
      schema:
        default: 1
        minimum: 1
        type: integer
  responses: {}
  schemas:
    ErrorDetails:
      properties:
        code:
          description: 에러 코드
          type: string
        details:
          description: 추가 에러 정보
          type: object
        message:
          description: 에러 메시지
          type: string
      required:
      - code
      - message
      type: object
    ErrorResponse:
      allOf:
      - $ref: '#/components/schemas/StandardResponse'
      - properties:
          data:
            type: 'null'
          success:
            example: false
            type: boolean
        type: object
    ResponseMeta:
      properties:
        request_id:
          description: 요청 ID
          format: uuid
          type: string
        timestamp:
          description: 응답 시간
          format: date-time
          type: string
        version:
          description: API 버전
          type: string
      required:
      - timestamp
      - version
      - request_id
      type: object
    StandardResponse:
      properties:
        data:
          description: 응답 데이터
        error:
          anyOf:
          - $ref: '#/components/schemas/ErrorDetails'
          - type: 'null'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        success:
          description: 요청 성공 여부
          type: boolean
      required:
      - success
      - data
      - error
      - meta
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http
    sessionAuth:
      in: cookie
      name: session
      type: apiKey
info:
  contact:
    email: dev@itglobal.com
    name: IT Global Development Team
  description: "IT Global 비즈니스 관리 대시보드를 위한 종합 API입니다.\n\n## 주요 기능\n- 프로젝트 관리 및 추적\n\
    - 매출 및 재무 분석\n- 실시간 모니터링 및 메트릭\n- 사용자 관리 및 인증\n- 캐시 및 시스템 관리\n\n## 인증 방식\n이 API는\
    \ 여러 인증 방법을 지원합니다:\n- 세션 기반 인증 (웹 인터페이스)\n- Bearer 토큰 인증 (API 접근)\n- Google OAuth\
    \ 2.0 (웹 인터페이스)\n\n## 표준 응답 형식\n모든 API 응답은 다음과 같은 표준 형식을 따릅니다:\n```json\n{\n \
    \ \"success\": true|false,\n  \"data\": any,\n  \"error\": {...},\n  \"meta\"\
    : {...}\n}\n```\n\n## 버전 관리\nAPI는 URL 경로 기반 버전 관리를 사용합니다 (/api/v1/, /api/v2/ 등)."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: IT Global Dashboard API
  version: 1.0.0
openapi: 3.0.3
